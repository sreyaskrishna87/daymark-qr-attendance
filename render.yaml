services:
  - type: web
    name: daymark-qr-attendance
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /var/data/attendance.db
      - key: OFFICE_ID
        value: OFFICE-HQ
      - key: QR_INTERVAL_SEC
        value: "25"
    disk:
      name: daymark-data
      mountPath: /var/data
      sizeGB: 1
